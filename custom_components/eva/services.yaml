    device_id:
      name: Eva device ID
      description: Use the API deviceId from an eva_event, not the Home Assistant device registry ID.
      required: true
      selector:
        text: {}
    time_start:
      name: Start time
      description: ISO timestamp including timezone, for example 2026-10-09T00:00:00+02:00.
      required: true
      selector:
        text: {}
    time_stop:
      name: End time
      description: ISO timestamp including timezone, later than the start time.
      required: true
      selector:
        text: {}
    time_zone:
      name: Time zone
      description: IANA time zone used to interpret local days and daylight saving time, for example Europe/Oslo.
      required: true
      selector:
        text: {}
get_home_events:
  name: Get home activity history
  description: Return a page of home activity records. Records can contain private names and descriptions.
  fields:
    config_entry_id:
      name: Eva home
      description: Select the configured Eva home and environment.
      required: true
      selector:
        config_entry:
          integration: eva
    device_id:
      name: Eva device ID
      description: Use the API deviceId from an eva_event, not the Home Assistant device registry ID.
      required: false
      selector:
        text: {}
    mood_id:
      name: Mood ID
      description: Optional Eva mood ID to filter the activity history.
      required: false
      selector:
        text: {}
    offset:
      name: Page index
      description: Zero for the first page, one for the second page; this is not a row offset.
      required: false
      selector:
        number:
          min: 0
          mode: box
      default: 0
    count:
      name: Record count
      description: Number of records to request.
      required: false
      selector:
        number:
          min: 1
          mode: box
      default: 100
